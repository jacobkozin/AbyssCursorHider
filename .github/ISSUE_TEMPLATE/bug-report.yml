name: Bug report
description: Report reproducible incorrect behavior in Abyss Cursor Hide
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Abyss Cursor Hide. Do not include credentials, private registry exports, personal paths, or other sensitive information.
  - type: input
    id: app-version
    attributes:
      label: Application version
      description: Which Abyss Cursor Hide version is affected?
      placeholder: "5.0.0-dev or commit SHA"
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Include the Windows edition, version, and whether it is 64-bit.
      placeholder: "Windows 11 24H2, 64-bit"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the actual and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that demonstrates the problem.
      placeholder: |
        1. Start the application
        2. Select ...
        3. Wait ...
        4. Observe ...
    validations:
      required: true
  - type: dropdown
    id: restore-result
    attributes:
      label: Did RestoreCursor.exe restore the cursor scheme?
      options:
        - Not applicable
        - Yes
        - No
        - Not tested
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add sanitized screenshots or other details if they help reproduce the issue.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, personal data, and unrelated machine information from this report.
          required: true
