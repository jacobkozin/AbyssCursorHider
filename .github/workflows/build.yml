name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The same preset commands as the README. The preset picks whichever
      # Visual Studio the runner has installed.
      - name: Configure
        run: cmake --preset windows-x64

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Package
        if: matrix.preset == 'release'
        run: cmake --build --preset package

      - name: Upload unsigned package
        if: matrix.preset == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AbyssCursorHide-windows-x64-unsigned
          path: build/windows-x64/AbyssCursorHide-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  # Publishing a GitHub Release (made by hand, for a tag such as v5.0.0) builds
  # that tag again and attaches the ZIP and its SHA-256 to the release.
  release-assets:
    if: github.event_name == 'release'
    needs: windows-x64
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: cmake --preset windows-x64

      - name: Build
        run: cmake --build --preset release --parallel

      - name: Test
        run: ctest --preset release

      - name: Package
        run: cmake --build --preset package

      - name: Attach the ZIP and its SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # The ZIP name comes from the version in CMakeLists.txt, so this also
          # catches a tag that does not match the project version.
          $expected = "AbyssCursorHide-$($env:TAG.TrimStart('v'))-windows-x64.zip"
          $zip = Get-Item "build/windows-x64/$expected"
          $hash = (Get-FileHash $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($zip.Name)" | Set-Content -Encoding ascii build/windows-x64/SHA256SUMS.txt
          gh release upload $env:TAG $zip.FullName build/windows-x64/SHA256SUMS.txt --clobber
