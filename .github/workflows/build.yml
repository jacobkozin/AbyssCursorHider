name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        # Let CMake select the Visual Studio version installed on the hosted
        # runner. The local developer preset intentionally remains on VS 2022.
        run: cmake -S . -B build/windows-x64 -A x64 -DABYSS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/windows-x64 --config ${{ matrix.configuration }}

      - name: Test
        run: ctest --test-dir build/windows-x64 -C ${{ matrix.configuration }} --output-on-failure

      - name: Package
        if: matrix.configuration == 'Release'
        run: cmake --build build/windows-x64 --config Release --target package

      - name: Upload unsigned package
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: AbyssCursorHide-windows-x64-unsigned
          path: build/windows-x64/AbyssCursorHide-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
