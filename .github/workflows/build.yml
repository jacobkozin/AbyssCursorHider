name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: cmake --preset windows-x64

      - name: Build
        run: cmake --build build/windows-x64 --config ${{ matrix.configuration }} --parallel

      - name: Test
        run: ctest --test-dir build/windows-x64 -C ${{ matrix.configuration }} --output-on-failure

      - name: Package
        if: matrix.configuration == 'Release'
        run: cmake --build build/windows-x64 --config Release --target package

      - name: Upload unsigned package
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: AbyssCursorHide-windows-x64-unsigned
          path: build/windows-x64/AbyssCursorHide-*-windows-x64.zip
          if-no-files-found: error
          retention-days: 14
